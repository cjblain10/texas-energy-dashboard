name: Update Dashboard Data

on:
  schedule:
    # Run daily at 6 AM UTC (midnight CST)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Python dependencies
        run: |
          pip install -r data-pipeline/requirements.txt

      - name: Run data pipeline
        run: |
          cd data-pipeline
          python run_all.py

      - name: Validate source results
        run: |
          jq -e '.pipelines | length == 3 and all(.[]; .status == "success")' public/data/pipeline_status.json

      - name: Sync data to dashboard
        run: |
          cp -f public/data/*.json dashboard/public/data/

      - name: Build dashboard
        run: |
          npm ci --prefix dashboard
          npm run build --prefix dashboard

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet public/data/ dashboard/public/data/; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/data/ dashboard/public/data/
          git commit -m "chore: update dashboard data $(date -u +%Y-%m-%d)"
          git push

      - name: Deploy verified build to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx netlify-cli@26.2.0 deploy --prod --no-build --dir dashboard/dist --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --message "Automated verified refresh ${GITHUB_SHA}"
